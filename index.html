<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #22222a;
    --border: #2e2e3a;
    --border2: #3d3d50;
    --text: #e8e8f0;
    --text2: #b0b0c8;
    --text3: #7070a0;
    --accent: #7c6af7;
    --accent2: #c4bbfc;
    --accent-bg: rgba(124,106,247,0.12);
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.1);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.1);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.1);
    --teal: #2dd4bf;
    --teal-bg: rgba(45,212,191,0.1);
    --radius: 8px;
    --radius-lg: 12px;
  }
  :root.light {
    --bg: #e2e2e8;
    --surface: #eaeaee;
    --surface2: #dddde4;
    --border: #ceceda;
    --border2: #b8b8c8;
    --text: #1a1a2e;
    --text2: #4a4a6a;
    --text3: #8888a8;
    --accent: #6254e8;
    --accent2: #4a3ecf;
    --accent-bg: rgba(98,84,232,0.08);
    --green: #16a34a;
    --green-bg: rgba(22,163,74,0.08);
    --amber: #b45309;
    --amber-bg: rgba(180,83,9,0.08);
    --red: #dc2626;
    --red-bg: rgba(220,38,38,0.08);
    --teal: #0f766e;
    --teal-bg: rgba(15,118,110,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }
  .header-title {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.04em;
  }
  .header-title span { color: var(--text3); }

  .theme-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 8px;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent2); }

  /* Version tabs */
  .ver-tabs {
    display: flex;
    gap: 4px;
    width: 100%;
  }
  .ver-tab {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .ver-tab:hover { border-color: var(--accent); color: var(--accent2); }
  .ver-tab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent2); }

  /* Layout */
  .layout { display: flex; height: calc(100vh - 49px); }

  /* Sidebar */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-gutter: stable;
  }
  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:last-child { border-bottom: none; }
  .sec-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Search */
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  /* Ability sliders */
  .ability-row { margin-bottom: 10px; }
  .ability-row:last-child { margin-bottom: 0; }
  .ability-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }
  .ability-name {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }
  .ability-val {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    min-width: 36px;
    text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* Skill filter */
  .skill-filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .skill-combo { position: relative; flex: 1; }
  .skill-combo-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
    cursor: text;
    transition: border-color 0.15s;
  }
  .skill-combo-input:focus { border-color: var(--accent); }
  .skill-combo-input::placeholder { color: var(--text3); }
  .skill-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 3px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
  }
  .skill-dropdown.open { display: block; }
  .skill-dropdown-group {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    padding: 6px 8px 3px;
    letter-spacing: 0.06em;
  }
  .skill-dropdown-item {
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.1s;
  }
  .skill-dropdown-item:hover, .skill-dropdown-item.active { background: var(--accent-bg); color: var(--accent2); }
  .skill-dropdown-empty { font-size: 11px; padding: 8px 10px; color: var(--text3); }
  .add-btn {
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .add-btn:hover { background: rgba(124,106,247,0.22); }

  .skill-threshold-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .skill-thresh-label {
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
  }
  .skill-thresh-val {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    min-width: 28px;
    text-align: right;
  }

  .filter-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .filter-tag {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 3px 8px 3px 9px;
    border-radius: 20px;
    background: var(--teal-bg);
    border: 1px solid rgba(45,212,191,0.3);
    color: var(--teal);
  }
  .filter-tag-remove {
    cursor: pointer;
    color: var(--teal);
    font-size: 13px;
    line-height: 1;
    opacity: 0.7;
    transition: opacity 0.1s;
  }
  .filter-tag-remove:hover { opacity: 1; }

  .reset-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    padding: 7px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* Main content */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .main-header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .result-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }
  .result-count b { color: var(--accent2); }

  /* Paste area */
  .paste-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px;
  }
  .paste-icon {
    font-family: 'Space Mono', monospace;
    font-size: 36px;
    color: var(--border2);
  }
  .paste-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text2);
  }
  .paste-sub { font-size: 12px; color: var(--text3); text-align: center; line-height: 1.7; }
  .paste-textarea {
    width: 100%;
    max-width: 500px;
    height: 120px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 12px;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .paste-textarea:focus { border-color: var(--accent); }
  .paste-error { font-size: 12px; color: var(--red); }
  .parse-btn {
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    color: var(--accent2);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 24px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .parse-btn:hover { background: rgba(124,106,247,0.22); }

  /* Card grid */
  .card-grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-content: start;
  }

  /* Character card */
  .char-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    transition: border-color 0.15s, transform 0.1s;
  }
  .char-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .char-card.is-lost { border-left: 3px solid var(--red); }
  .char-card.is-lost { border-left: 3px solid var(--red); }
  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-bg);
    border: 1px solid rgba(124,106,247,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    flex-shrink: 0;
  }
  .card-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .card-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .ver-badge {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--accent-bg);
    border: 1px solid var(--accent);
    color: var(--accent2);
    flex-shrink: 0;
  }

  /* Ability chips */
  .ability-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 9px;
  }
  .ability-chip {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .ability-chip b { color: var(--text); font-weight: 700; }

  /* Skill pills */
  .skill-pills { display: flex; flex-wrap: wrap; gap: 4px; }
  .skill-pill {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--green-bg);
    border: 1px solid rgba(74,222,128,0.25);
    color: var(--green);
  }
  .skill-pill.highlight {
    background: var(--teal-bg);
    border-color: rgba(45,212,191,0.35);
    color: var(--teal);
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    font-size: 13px;
  }


</style>
</head>
<body>

<div class="header">
  <div class="header-title">CoC<span> / </span>Character Finder</div>
  <button class="theme-btn" id="themeBtn">☀ ライト</button>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sec-label">バージョン</div>
      <div class="ver-tabs" style="margin-left:0;">
        <button class="ver-tab" data-ver="7" style="flex:1;text-align:center;">7版</button>
        <button class="ver-tab active" data-ver="6" style="flex:1;text-align:center;">6版</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sec-label">キャラクター検索</div>
      <input type="text" class="search-input" id="nameSearch" placeholder="名前・フリガナ" />
    </div>

    <div class="sidebar-section">
      <div class="sec-label">能力値フィルター</div>
      <div id="abilityFilters"></div>
    </div>

    <div class="sidebar-section">
      <div class="sec-label">技能フィルター</div>
      <div class="skill-filter-row" style="flex-direction:column;">
      <div class="skill-combo">
        <input type="text" class="skill-combo-input" id="skillComboInput" placeholder="技能を検索..." autocomplete="off" />
        <div class="skill-dropdown" id="skillDropdown"></div>
      </div>
        <button class="add-btn" id="addSkillFilter" style="width:100%;text-align:center;">+ 追加</button>
      </div>
      <div class="skill-threshold-row">
        <span class="skill-thresh-label">閾値：</span>
        <input type="range" id="skillThreshold" min="0" max="100" value="50" step="1" style="flex:1;" />
        <span class="skill-thresh-val" id="skillThreshVal">50以上</span>
      </div>
      <div class="filter-tags" id="skillFilterTags"></div>
    </div>

    <div class="sidebar-section">
      <button class="reset-btn" id="resetBtn">フィルターをリセット</button>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
        <span style="font-size:12px;color:var(--text2);">ロスト探索者を表示</span>
        <label style="position:relative;display:inline-block;width:36px;height:20px;cursor:pointer;">
          <input type="checkbox" id="showLost" checked style="opacity:0;width:0;height:0;position:absolute;" />
          <span id="toggleTrack" style="position:absolute;inset:0;border-radius:20px;background:var(--accent);transition:background 0.2s;"></span>
          <span id="toggleThumb" style="position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 0.2s;transform:translateX(16px);"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <span class="result-count" id="resultCount">データなし</span>
    </div>
    <div id="pasteArea" class="paste-area">
      <div class="paste-icon">{  }</div>
      <div class="paste-title">JSONを貼り付けてください</div>
      <div class="paste-sub">キャラクターデータ（配列またはオブジェクト）を<br>テキストエリアに貼り付けてパースします</div>
      <textarea class="paste-textarea" id="jsonInput" placeholder='[{ "id": ..., "data": { ... } }, ...]'></textarea>
      <div class="paste-error" id="parseError"></div>
      <button class="parse-btn" id="parseBtn">読み込む</button>
    </div>
    <div id="cardGrid" class="card-grid" style="display:none;"></div>
  </div>
</div>

<script>
// ===== State =====
let allChars = [];
let currentVer = '6';
let skillFilters = []; // [{name, threshold}]
let abilityMinMap = {}; // {STR: 30, ...}

// 7版 vs 6版で表示する能力値とスライダー最大値
const VER_CONFIG = {
  '7': {
    abilities: ['STR','DEX','INT','POW','CON','EDU','APP','SIZ','LUK'],
    abMax: 90,
    abMaxOverride: { EDU: 99 },
    abilityKeys: { STR:'str', DEX:'dex', INT:'int', POW:'pow', CON:'con', EDU:'edu', APP:'app', SIZ:'siz', LUK:'luck' }
  },
  '6': {
    abilities: ['STR','DEX','INT','POW','CON','EDU','APP','SIZ'],
    abMax: 18,
    abMaxOverride: { EDU: 21 },
    abilityKeys: { STR:'str', DEX:'dex', INT:'int', POW:'pow', CON:'con', EDU:'edu', APP:'app', SIZ:'siz' }
  }
};

// ===== Parse JSON =====
document.getElementById('parseBtn').addEventListener('click', () => {
  const raw = document.getElementById('jsonInput').value.trim();
  const errEl = document.getElementById('parseError');
  errEl.textContent = '';
  try {
    let parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) parsed = [parsed];
    allChars = parsed;
    document.getElementById('pasteArea').style.display = 'none';
    document.getElementById('cardGrid').style.display = 'grid';
    buildSkillSelect();
    renderAbilityFilters();
    renderCards();
  } catch(e) {
    errEl.textContent = 'JSONの解析に失敗しました: ' + e.message;
  }
});

// ===== Version tabs =====
document.querySelectorAll('.ver-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentVer = btn.dataset.ver;
    document.querySelectorAll('.ver-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    abilityMinMap = {};
    skillFilters = [];
    document.getElementById('skillFilterTags').innerHTML = '';
    renderAbilityFilters();
    buildSkillSelect();
    renderCards();
  });
});

// ===== Ability filters =====
function renderAbilityFilters() {
  const cfg = VER_CONFIG[currentVer];
  const container = document.getElementById('abilityFilters');
  container.innerHTML = '';
  cfg.abilities.forEach(ab => {
    const min = abilityMinMap[ab] || 0;
    const div = document.createElement('div');
    div.className = 'ability-row';
    div.innerHTML = `
      <div class="ability-head">
        <span class="ability-name">${ab}</span>
        <span class="ability-val" id="abval-${ab}">${min > 0 ? min + '以上' : '指定なし'}</span>
      </div>
      <input type="range" min="0" max="${(cfg.abMaxOverride && cfg.abMaxOverride[ab]) || cfg.abMax}" value="${min}" step="1" data-ab="${ab}" />
    `;
    div.querySelector('input').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      abilityMinMap[ab] = v;
      document.getElementById('abval-' + ab).textContent = v > 0 ? v + '以上' : '指定なし';
      renderCards();
    });
    container.appendChild(div);
  });
}

// ===== 技能名の正規化（共通） =====
// （）なしでまとめて扱う技能
const GROUP_SKILLS = new Set(['操縦','芸術','製作','運転','母国語','近接戦闘','射撃','言語','科学']);

// プルダウン・フィルター用：GROUP_SKILLSは親名のみ
function skillFullName(sk) {
  const add = sk.additionalName || '';
  if (GROUP_SKILLS.has(sk.name)) return sk.name;
  return sk.name + (add ? '（' + add + '）' : '');
}

// カード表示用：常に（）込み
function skillDisplayName(sk) {
  const add = sk.additionalName || '';
  return sk.name + (add ? '（' + add + '）' : '');
}

// ===== Skill select =====
const CAT_LABELS = {
  actionSkills: '行動技能',
  battleSkills: '戦闘技能',
  searchSkills: '探索技能',
  knowledgeSkills: '知識技能',
  negotiationSkills: '交渉技能'
};
const CAT_ORDER = ['actionSkills','battleSkills','searchSkills','knowledgeSkills','negotiationSkills'];

function buildSkillSelect() {
  const sel = document.getElementById('skillSelect');
  sel.innerHTML = '<option value="">技能を選択...</option>';
  const bycat = collectSkillsByCategory();
  CAT_ORDER.forEach(cat => {
    const names = bycat[cat];
    if (!names || names.length === 0) return;
    const grp = document.createElement('optgroup');
    grp.label = CAT_LABELS[cat];
    names.sort((a,b) => a.localeCompare(b, 'ja')).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
}

function collectSkillsByCategory() {
  const result = {};
  CAT_ORDER.forEach(cat => result[cat] = new Set());
  const chars = allChars.filter(c => (c.data?.version || '7th').startsWith(currentVer));
  chars.forEach(ch => {
    const d = ch.data;
    CAT_ORDER.forEach(cat => {
      const skills = d[cat];
      if (!skills) return;
      [...(skills.static || []), ...(skills.additional || [])].forEach(sk => {
        if (!sk.name) return;
        // GROUP_SKILLSは親名のみ登録、（）付きは無視
        if (GROUP_SKILLS.has(sk.name)) {
          result[cat].add(sk.name);
        } else {
          result[cat].add(skillDisplayName(sk));
        }
      });
    });
  });
  CAT_ORDER.forEach(cat => result[cat] = [...result[cat]]);
  return result;
}

// ===== Custom skill combobox =====
let allSkillOptions = []; // [{cat, name}]
let selectedSkillName = '';
let activeIndex = -1;

function buildSkillSelect() {
  const bycat = collectSkillsByCategory();
  allSkillOptions = [];
  CAT_ORDER.forEach(cat => {
    const names = bycat[cat];
    if (!names || names.length === 0) return;
    names.sort((a,b) => a.localeCompare(b, 'ja')).forEach(name => {
      allSkillOptions.push({ cat, name });
    });
  });
  selectedSkillName = '';
  document.getElementById('skillComboInput').value = '';
  renderDropdown('');
}

function renderDropdown(query) {
  const dropdown = document.getElementById('skillDropdown');
  const q = query.trim().toLowerCase();
  const filtered = q ? allSkillOptions.filter(o => o.name.toLowerCase().includes(q)) : allSkillOptions;

  if (filtered.length === 0) {
    dropdown.innerHTML = '<div class="skill-dropdown-empty">該当なし</div>';
    return;
  }

  let html = '';
  let lastCat = null;
  filtered.forEach((o, i) => {
    if (o.cat !== lastCat) {
      html += `<div class="skill-dropdown-group">${CAT_LABELS[o.cat]}</div>`;
      lastCat = o.cat;
    }
    html += `<div class="skill-dropdown-item" data-name="${o.name}" data-i="${i}">${o.name}</div>`;
  });
  dropdown.innerHTML = html;
  activeIndex = -1;

  dropdown.querySelectorAll('.skill-dropdown-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      selectSkill(el.dataset.name);
    });
  });
}

let suppressInput = false;

function selectSkill(name) {
  selectedSkillName = name;
  suppressInput = true;
  document.getElementById('skillComboInput').value = name;
  suppressInput = false;
  document.getElementById('skillDropdown').classList.remove('open');
}

const comboInput = document.getElementById('skillComboInput');
const dropdown = document.getElementById('skillDropdown');

comboInput.addEventListener('focus', () => {
  renderDropdown(comboInput.value);
  dropdown.classList.add('open');
});
comboInput.addEventListener('blur', () => {
  setTimeout(() => dropdown.classList.remove('open'), 150);
});
comboInput.addEventListener('input', () => {
  if (suppressInput) return;
  selectedSkillName = '';
  renderDropdown(comboInput.value);
  dropdown.classList.add('open');
});
let isComposing = false;
comboInput.addEventListener('compositionstart', () => { isComposing = true; });
comboInput.addEventListener('compositionend', () => { isComposing = false; });

comboInput.addEventListener('keydown', e => {
  if (isComposing) return;
  const items = dropdown.querySelectorAll('.skill-dropdown-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    items[activeIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    items[activeIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && items[activeIndex]) {
      selectSkill(items[activeIndex].dataset.name);
    } else if (items.length >= 1) {
      selectSkill(items[0].dataset.name);
    }
  } else if (e.key === 'Escape') {
    dropdown.classList.remove('open');
  }
});

// ===== Skill threshold =====
document.getElementById('skillThreshold').addEventListener('input', e => {
  document.getElementById('skillThreshVal').textContent = e.target.value + '以上';
});

document.getElementById('addSkillFilter').addEventListener('click', () => {
  const name = selectedSkillName || comboInput.value.trim();
  if (!name) return;
  const threshold = parseInt(document.getElementById('skillThreshold').value);
  if (skillFilters.some(f => f.name === name)) return;
  skillFilters.push({ name, threshold });
  selectedSkillName = '';
  comboInput.value = '';
  renderSkillTags();
  renderCards();
});

function renderSkillTags() {
  const container = document.getElementById('skillFilterTags');
  container.innerHTML = '';
  skillFilters.forEach((f, i) => {
    const tag = document.createElement('div');
    tag.className = 'filter-tag';
    tag.innerHTML = `${f.name} ≥${f.threshold}<span class="filter-tag-remove" data-i="${i}">×</span>`;
    tag.querySelector('.filter-tag-remove').addEventListener('click', () => {
      skillFilters.splice(i, 1);
      renderSkillTags();
      renderCards();
    });
    container.appendChild(tag);
  });
}

// ===== Theme toggle =====
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const isLight = document.documentElement.classList.toggle('light');
  themeBtn.textContent = isLight ? '☽ ダーク' : '☀ ライト';
});

// ===== Lost toggle =====
const showLostCb = document.getElementById('showLost');
const toggleThumb = document.getElementById('toggleThumb');
const toggleTrack = document.getElementById('toggleTrack');
showLostCb.addEventListener('change', () => {
  const on = showLostCb.checked;
  toggleThumb.style.transform = on ? 'translateX(16px)' : 'translateX(3px)';
  toggleTrack.style.background = on ? 'var(--accent)' : 'var(--border2)';
  renderCards();
});

// ===== Name search =====
document.getElementById('nameSearch').addEventListener('input', renderCards);

// ===== Reset =====
document.getElementById('resetBtn').addEventListener('click', () => {
  abilityMinMap = {};
  skillFilters = [];
  document.getElementById('nameSearch').value = '';
  document.getElementById('skillFilterTags').innerHTML = '';
  renderAbilityFilters();
  renderCards();
});

// ===== Get skill value =====
function getSkillValue(ch, rawName) {
  const d = ch.data;
  const isGroup = GROUP_SKILLS.has(rawName);
  let best = null;
  for (const cat of CAT_ORDER) {
    const skills = d[cat];
    if (!skills) continue;
    const all = [...(skills.static || []), ...(skills.additional || [])];
    for (const sk of all) {
      const match = isGroup ? sk.name === rawName : skillFullName(sk) === rawName;
      if (match) {
        const val = (sk.defaultPoint||0) + (sk.professionPoint||0) + (sk.interestPoint||0) + (sk.growthPoint||0) + (sk.otherPoint||0);
        if (best === null || val > best) best = val;
      }
    }
  }
  return best;
}

// ===== Get ability value =====
function getAbilityValue(ch, abKey) {
  const v = ch.data?.abilities?.[abKey];
  if (!v) return 0;
  return (v.value || 0) + (v.fixedDiff || 0) + (v.tmpFixedDiff || 0);
}

// ===== Get top skills =====
function getTopSkills(ch, highlightNames) {
  const d = ch.data;
  const cats = ['actionSkills','battleSkills','searchSkills','knowledgeSkills','negotiationSkills'];
  const all = [];
  cats.forEach(cat => {
    const skills = d[cat];
    if (!skills) return;
    [...(skills.static||[]), ...(skills.additional||[])].forEach(sk => {
      const val = (sk.defaultPoint||0)+(sk.professionPoint||0)+(sk.interestPoint||0)+(sk.growthPoint||0)+(sk.otherPoint||0);
      const fullName = skillDisplayName(sk);
      const baseName = fullName.replace(/（.*）$/, '');
      const isHighlighted = highlightNames.has(fullName) || (GROUP_SKILLS.has(baseName) && highlightNames.has(baseName));
      // フィルター対象技能は値に関わらず含める、それ以外はデフォルト以外の点がある場合のみ
      if (isHighlighted || (sk.professionPoint||0)+(sk.interestPoint||0)+(sk.growthPoint||0)+(sk.otherPoint||0) > 0) {
        all.push({ name: fullName, val, isHighlighted });
      }
    });
  });
  all.sort((a,b) => b.val - a.val);
  // フィルター対象は必ず含め、残りはtop6まで
  const highlighted = all.filter(s => s.isHighlighted);
  const others = all.filter(s => !s.isHighlighted).slice(0, Math.max(0, 6 - highlighted.length));
  return [...highlighted, ...others].sort((a,b) => b.val - a.val);
}

// ===== Render =====
function renderCards() {
  const cfg = VER_CONFIG[currentVer];
  const nameQ = document.getElementById('nameSearch').value.trim().toLowerCase();

  const filtered = allChars.filter(ch => {
    const ver = (ch.data?.version || '7th').startsWith(currentVer);
    if (!ver) return false;

    // Name search
    const name = (ch.data?.profile?.name || ch.name || '').toLowerCase();
    const furi = (ch.data?.profile?.furi || '').toLowerCase();
    if (nameQ && !name.includes(nameQ) && !furi.includes(nameQ)) return false;

    // Lost filter
    if (!document.getElementById('showLost').checked && ch.data?.profile?.isLost) return false;

    // Ability filters
    for (const [ab, minVal] of Object.entries(abilityMinMap)) {
      if (minVal <= 0) continue;
      const key = cfg.abilityKeys[ab];
      if (!key) continue;
      if (getAbilityValue(ch, key) < minVal) return false;
    }

    // Skill filters
    for (const sf of skillFilters) {
      const val = getSkillValue(ch, sf.name);
      if (val === null || val < sf.threshold) return false;
    }

    return true;
  });

  const grid = document.getElementById('cardGrid');
  const countEl = document.getElementById('resultCount');
  const total = allChars.filter(c => (c.data?.version||'7th').startsWith(currentVer)).length;
  countEl.innerHTML = `<b>${filtered.length}</b> / ${total} キャラクター`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">条件に一致するキャラクターが見つかりません</div>';
    return;
  }

  const hlNames = new Set(skillFilters.map(f => f.name));

  grid.innerHTML = '';
  filtered.forEach(ch => {
    const prof = ch.data?.profile || {};
    const name = prof.name || ch.name || '不明';
    const furi = prof.furi || '';
    const age = prof.age || '';
    const sex = prof.sex || '';
    const profession = prof.profession || '';
    const isLost = prof.isLost;

    // Avatar initials
    const initials = name.replace(/[（(].*/, '').trim().slice(0,2);

    // Abilities
    const abChips = cfg.abilities.map(ab => {
      const key = cfg.abilityKeys[ab];
      const val = getAbilityValue(ch, key);
      return `<div class="ability-chip">${ab} <b>${val}</b></div>`;
    }).join('');

    // Skills
    const topSkills = getTopSkills(ch, hlNames);
    const skillHtml = topSkills.map(s => {
      // GROUP_SKILLSのフィルターは親名だけで照合
      const baseName = s.name.replace(/（.*）$/, '');
      const isHl = hlNames.has(s.name) || (GROUP_SKILLS.has(baseName) && hlNames.has(baseName));
      return `<span class="skill-pill${isHl ? ' highlight' : ''}">${s.name} ${s.val}</span>`;
    }).join('');

    const subParts = [];
    if (furi) subParts.push(furi);
    const meta = [age ? age + '歳' : '', sex].filter(Boolean).join('・');
    if (meta) subParts.push(meta);
    if (profession) subParts.push(profession);

    const card = document.createElement('div');
    card.className = 'char-card' + (isLost ? ' is-lost' : '');
    card.innerHTML = `
      <div class="card-top">
        <div class="avatar">${initials}</div>
        <div style="flex:1;min-width:0;">
          <div class="card-name">${name}</div>
          ${subParts.length ? `<div class="card-sub">${subParts.join(' ｜ ')}</div>` : ''}
        </div>
        <div class="ver-badge">${currentVer}版</div>
        <a href="https://iachara.com/view/${ch.id}" target="_blank" rel="noopener" title="キャラクターページを開く" style="display:flex;align-items:center;color:var(--text3);text-decoration:none;margin-left:4px;flex-shrink:0;transition:color 0.15s;" onmouseover="this.style.color='var(--accent2)'" onmouseout="this.style.color='var(--text3)'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
      <div class="ability-chips">${abChips}</div>
      <div class="skill-pills">${skillHtml || '<span style="font-size:11px;color:var(--text3);">技能データなし</span>'}</div>
    `;
    grid.appendChild(card);
  });
}

// Init
renderAbilityFilters();
