<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索者名簿</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sec-label">バージョン</div>
      <div class="ver-tabs" style="margin-left:0;">
        <button class="ver-tab" data-ver="7" style="flex:1;text-align:center;">7版</button>
        <button class="ver-tab active" data-ver="6" style="flex:1;text-align:center;">6版</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sec-label">キャラクター検索</div>
      <input type="text" class="search-input" id="nameSearch" placeholder="名前・フリガナ" />
    </div>

    <div class="sidebar-section">
      <div class="sec-label">正気度フィルター</div>
      <div class="ability-row">
        <div class="ability-head">
          <span class="ability-name">SAN</span>
          <span class="ability-val" id="abval-SAN">指定なし</span>
        </div>
        <input type="range" id="sanRange" min="0" max="99" value="0" step="1" />
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sec-label">能力値フィルター</div>
      <div id="abilityFilters"></div>
    </div>

    <div class="sidebar-section">
      <div class="sec-label">技能フィルター</div>
      <div class="skill-filter-row" style="flex-direction:column;">
      <div class="skill-combo">
        <input type="text" class="skill-combo-input" id="skillComboInput" placeholder="技能を検索..." autocomplete="off" />
        <div class="skill-dropdown" id="skillDropdown"></div>
      </div>
      </div>
      <div class="skill-threshold-row">
        <span class="skill-thresh-label">閾値：</span>
        <input type="range" id="skillThreshold" min="0" max="100" value="50" step="1" style="flex:1;" />
        <span class="skill-thresh-val" id="skillThreshVal">50以上</span>
      </div>
      <button class="add-btn" id="addSkillFilter" style="width:100%;text-align:center;margin-bottom:8px;">+ 追加</button>
      <div class="filter-tags" id="skillFilterTags"></div>
    </div>

    <div class="sidebar-section">
      <button class="reset-btn" id="resetBtn">フィルターをリセット</button>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
        <span style="font-size:12px;color:var(--text2);">ロスト探索者を表示</span>
        <label style="position:relative;display:inline-block;width:36px;height:20px;cursor:pointer;">
          <input type="checkbox" id="showLost" checked style="opacity:0;width:0;height:0;position:absolute;" />
          <span id="toggleTrack" style="position:absolute;inset:0;border-radius:20px;background:var(--red);transition:background 0.2s;"></span>
          <span id="toggleThumb" style="position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 0.2s;transform:translateX(16px);"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <div style="flex:1;"></div>
      <div class="header-title"><img src="icon.svg?v=2" class="header-icon" style="width:32px;height:32px;vertical-align:middle;margin-right:12px;">Call of Cthulhu<span> / </span>探索者名簿</div>
      <div style="flex:1;display:flex;justify-content:flex-end;">
        <button class="theme-btn" id="themeBtn">☀ ライト</button>
      </div>
    </div>
    <div class="main-header">
      <span class="result-count" id="resultCount">データなし</span>
    </div>
    <div id="pasteArea" class="paste-area">
      <div class="paste-icon">{  }</div>
      <div class="paste-title">JSONを貼り付けてください</div>
      <div class="paste-sub">キャラクターデータ（配列またはオブジェクト）を<br>テキストエリアに貼り付けてパースします</div>
      <textarea class="paste-textarea" id="jsonInput" placeholder='[{ "id": ..., "data": { ... } }, ...]'></textarea>
      <div class="paste-error" id="parseError"></div>
      <button class="parse-btn" id="parseBtn">読み込む</button>
    </div>
    <div id="cardGrid" class="card-grid" style="display:none;"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
